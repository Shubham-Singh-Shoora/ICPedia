[package]
name = "user_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.12"
serde = { version = "1.0", features = ["derive"] }
shared = { path = "../shared" }

[profile.release]
opt-level = 3
lto = true
debug = false
strip = true